services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: deepfake_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deepfake_network

  redis:
    image: redis:7-alpine
    container_name: deepfake_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deepfake_network

  minio:
    image: minio/minio:latest
    container_name: deepfake_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - deepfake_network

  minio-init:
    image: minio/mc:latest
    container_name: deepfake_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 8;
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb -p local/${MINIO_BUCKET_RAW} || true;
      mc mb -p local/${MINIO_BUCKET_PROCESSED} || true;
      mc mb -p local/${MINIO_BUCKET_REPORTS} || true;
      exit 0;
      "
    networks:
      - deepfake_network

networks:
  deepfake_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: